<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPG teste</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#999; }
  body.front { --bg:#fff; --fg:#111; --muted:#555; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, system-ui, sans-serif; }
  main { padding:12px 16px; max-width:640px; margin:0 auto; }
  .warn { background:#fc3; color:#000; padding:8px 10px; border-radius:6px; font-size:14px; margin:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  button, select { font-size:17px; padding:10px 14px; border-radius:8px; }
  video { width:80px; height:60px; background:#000; border-radius:4px; object-fit:cover; }
  #chart { width:100%; height:120px; display:block; border:1px solid #8884; border-radius:6px; }
  #hr { width:100%; height:200px; display:block; border:1px solid #8884; border-radius:6px; margin-top:8px; }
  #pacer { height:36px; border:1px solid #8884; border-radius:6px; position:relative; overflow:hidden; }
  #pfill { position:absolute; left:0; top:0; bottom:0; width:0; background:#38f; }
  #plabel { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; }
  .big { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .big div { font-size:14px; color:var(--muted); }
  .big b { display:block; font-size:44px; color:var(--fg); font-variant-numeric:tabular-nums; }
  #status, #reason, #garmin { font-size:14px; color:var(--muted); min-height:1.2em; margin:6px 0; }
  a { color:inherit; }
  textarea { width:100%; height:140px; font-size:11px; box-sizing:border-box; }
</style>
</head>
<body>
<main>
  <p class="warn">Desative Modo Baixa Energia. Não troque de aba durante o teste.</p>
  <div class="row">
    <select id="mode">
      <option value="rear">Traseira (vermelho)</option>
      <option value="front">Frontal (verde, tela branca)</option>
    </select>
    <button id="go">Iniciar</button>
    <button id="rec" disabled>Gravar 60 s</button>
    <button id="rec2" disabled>Gravar 2 min</button>
    <button id="ble">Conectar Garmin</button>
    <video id="video" playsinline muted autoplay></video>
  </div>
  <div id="status">Parado.</div>
  <div id="garmin">Garmin: desconectado</div>
  <div class="row">
    Respiração
    <select id="rate">
      <option value="6.5">6,5/min</option>
      <option value="6" selected>6/min</option>
      <option value="5.5">5,5/min</option>
      <option value="5">5/min</option>
      <option value="4.5">4,5/min</option>
      <option value="0">sem pacer</option>
    </select>
  </div>
  <div id="pacer"><div id="pfill"></div><div id="plabel"></div></div>
  <canvas id="hr"></canvas>
  <div class="big">
    <div>BPM<b id="bpm">--</b></div>
    <div>Variação/resp (bpm)<b id="rsa">--</b></div>
    <div>Último RR (ms)<b id="rr">--</b></div>
    <div>Qualidade<b id="q">--</b></div>
    <div>FPS<b id="fps">--</b></div>
    <div>Extrassístoles (1 min)<b id="ect">--</b></div>
  </div>
  <div id="reason"></div>
  <canvas id="chart"></canvas>
  <div id="out" hidden>
    <p><a id="dl">Baixar CSV</a> — se o download não funcionar, copie o texto abaixo.</p>
    <textarea id="csv" readonly></textarea>
  </div>
  <canvas id="work" width="64" height="48" hidden></canvas>
</main>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), chart = $('chart'), cx = chart.getContext('2d'), hrc = $('hr'), hx = hrc.getContext('2d');
const work = $('work').getContext('2d', { willReadFrequently: true });
const W = 64, H = 48, K = 6; // K: amostras de cada lado para confirmar um pico (~200 ms de atraso)
// passa-baixa Butterworth de 2ª ordem, 3 Hz a 30 fps: remove o entalhe dicrótico que virava pico falso
const LP = (() => { const w = 2 * Math.PI * 3 / 30, c = Math.cos(w), a = Math.sin(w) / Math.SQRT2, a0 = 1 + a;
                    return [(1 - c) / 2 / a0, (1 - c) / a0, (1 - c) / 2 / a0, -2 * c / a0, (1 - a) / a0]; })();
const COLORS = { rear: { bg: '#111', raw: '#777', filt: '#f33', peak: '#fff' },
                 front: { bg: '#fff', raw: '#aaa', filt: '#080', peak: '#000' } };

let stream = null, running = false, mode = 'rear', useRVFC = false, lastVideoTime = -1, frameId = null;
let wakeLock = null, statusBase = '';
let buf = [];                       // {t, ts, raw, det, filt, peak, rr} dos últimos 15 s
let lastPeakT = null, lastRR = null;
let rrLog = [], rrValid = [];       // rrLog: válido? dos últimos 20 RR; rrValid: últimos 8 RR válidos
let rrRecent = [];                  // últimos 8 RR dentro de 300–2000 ms, válidos ou não (referência da mediana)
let lpz = [0, 0, 0, 0];             // estado do passa-baixa
let amps = [], motionUntil = 0;     // amplitude dos últimos 2 s (~10 s de histórico); fim do bloqueio por movimento
let beats = [];                     // {t, hr} dos batimentos válidos dos últimos 60 s
let prevRR = null, prev2RR = null, ectopic = []; // 2 RR anteriores (consecutivos); horários das possíveis extrassístoles
let pacerT0 = 0, rate = 6;          // rate: respirações/min (0 = sem pacer)
const INHALE = 0.4;                 // inspiração = 40% do ciclo (4 s de 10 s): expiração mais longa, como no paper
let rec = null, recStart = 0, recDur = 60000;
let garminBpm = '', garminRR = [];  // último BPM do Garmin; RR recebidos desde o último frame

$('go').onclick = () => running ? stop() : start().catch(e => { stop(); $('status').textContent = 'Erro: ' + e.name + ' — ' + e.message; });
$('mode').onchange = () => { if (running) start().catch(e => { stop(); $('status').textContent = 'Erro: ' + e.name; }); };
// 2 min: ~12 respirações a 6/min (o paper pede pelo menos 10 por ritmo)
const startRec = ms => { rec = []; recStart = performance.now(); recDur = ms; $('rec').disabled = $('rec2').disabled = $('mode').disabled = true; $('out').hidden = true; };
$('rec').onclick = () => startRec(60000);
$('rec2').onclick = () => startRec(120000);
$('csv').onfocus = e => e.target.select();
$('rate').onchange = () => { rate = +$('rate').value; pacerT0 = performance.now(); };
$('ble').onclick = () => connectGarmin().catch(e => { $('garmin').textContent = 'Garmin: erro — ' + e.message; });
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') requestWakeLock(); });

async function requestWakeLock() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* não suportado */ }
}

// Frequência cardíaca do relógio pelo serviço padrão Bluetooth (Garmin: "Transmitir FC")
async function connectGarmin() {
  if (!navigator.bluetooth) { $('garmin').textContent = 'Garmin: sem Bluetooth neste navegador (use o Bluefy)'; return; }
  const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
  dev.addEventListener('gattserverdisconnected', () => { garminBpm = ''; $('garmin').textContent = 'Garmin: desconectado'; });
  const server = await dev.gatt.connect();
  const ch = await (await server.getPrimaryService('heart_rate')).getCharacteristic('heart_rate_measurement');
  ch.addEventListener('characteristicvaluechanged', e => onHeartRate(e.target.value));
  await ch.startNotifications();
  $('garmin').textContent = 'Garmin: conectado (' + (dev.name || 'sem nome') + ')';
}

// Heart Rate Measurement: flags, BPM (uint8 ou uint16), [energia uint16], [RR uint16 em 1/1024 s]
function onHeartRate(v) {
  const flags = v.getUint8(0), wide = flags & 1;
  garminBpm = wide ? v.getUint16(1, true) : v.getUint8(1);
  let i = wide ? 3 : 2;
  if (flags & 8) i += 2;
  if (flags & 16) for (; i + 1 < v.byteLength; i += 2) garminRR.push(Math.round(v.getUint16(i, true) * 1000 / 1024));
  $('garmin').textContent = `Garmin: ${garminBpm} bpm · ${flags & 16 ? 'com RR' : 'sem RR'}`;
}

async function start() {
  stop();
  mode = $('mode').value;
  document.body.classList.toggle('front', mode === 'front');
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
    facingMode: mode === 'front' ? 'user' : 'environment',
    width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } } });
  video.srcObject = stream;
  await video.play();

  const track = stream.getVideoTracks()[0];
  let torch;
  try {
    await track.applyConstraints({ advanced: [{ torch: true }] });
    torch = track.getSettings().torch ? 'LIGADO' : 'não (ignorado)';
  } catch (e) { torch = 'não (' + e.name + ')'; }

  buf = []; lastPeakT = lastRR = null; rrLog = []; rrValid = []; rrRecent = []; lastVideoTime = -1;
  lpz = [0, 0, 0, 0]; amps = []; motionUntil = 0; beats = []; prevRR = prev2RR = null; ectopic = []; pacerT0 = performance.now();
  useRVFC = 'requestVideoFrameCallback' in video;
  statusBase = `Câmera ${video.videoWidth}x${video.videoHeight} · captura ${useRVFC ? 'rVFC' : 'rAF'} · flash: ${torch}`;
  running = true;
  $('go').textContent = 'Parar';
  $('rec').disabled = $('rec2').disabled = false;
  requestWakeLock();
  schedule();
}

function stop() {
  running = false; rec = null;
  // cancela o callback pendente; senão ele dispara no próximo start e vira um segundo loop
  if (frameId !== null) (useRVFC ? video.cancelVideoFrameCallback(frameId) : cancelAnimationFrame(frameId));
  frameId = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (wakeLock) wakeLock.release().catch(() => {});
  wakeLock = null;
  $('go').textContent = 'Iniciar';
  $('rec').disabled = $('rec2').disabled = true; $('mode').disabled = false;
  $('status').textContent = 'Parado.';
}

function schedule() {
  if (!running) return;
  frameId = useRVFC ? video.requestVideoFrameCallback(onFrame) : requestAnimationFrame(onFrame);
}

function onFrame() {
  if (!running) return;
  // no rAF o mesmo frame de vídeo pode aparecer mais de uma vez
  if (video.readyState >= 2 && (useRVFC || video.currentTime !== lastVideoTime)) {
    lastVideoTime = video.currentTime;
    process(readChannel());
    draw();
    drawHR();
    show();
  }
  schedule();
}

function readChannel() {
  work.drawImage(video, 0, 0, W, H);
  const d = work.getImageData(0, 0, W, H).data, c = mode === 'front' ? 1 : 0;
  let s = 0;
  for (let i = c; i < d.length; i += 4) s += d[i];
  return s / (W * H);
}

function process(raw) {
  const t = performance.now(), ph = pacerPhase(t);
  const s = { t, ts: Date.now(), raw, det: 0, filt: 0, peak: 0, rr: '', mov: 0,
              pacer: ph ? (ph.inhale ? 1 : 0) : '', garmin: garminBpm, grr: garminRR.join(' ') };
  garminRR = [];
  buf.push(s);
  if (rec) rec.push(s);
  // remove tendência: subtrai média móvel de 1,5 s
  let sum = 0, n = 0;
  for (let i = buf.length - 1; i >= 0 && buf[i].t >= t - 1500; i--) { sum += buf[i].raw; n++; }
  s.det = raw - sum / n;
  // média de 5 amostras: só para o indicador de qualidade, que mede o ruído que ela remove
  s.sm = buf.slice(-5).reduce((a, b) => a + b.det, 0) / Math.min(5, buf.length);
  // passa-baixa; inverte porque o pulso escurece a imagem
  const [b0, b1, b2, a1, a2] = LP, y = b0 * s.det + b1 * lpz[0] + b2 * lpz[1] - a1 * lpz[2] - a2 * lpz[3];
  lpz = [s.det, lpz[0], y, lpz[2]];
  s.filt = -y;
  // movimento do dedo: amplitude dos últimos 2 s muito acima da típica; descarta batimentos por 1 s
  let mn = Infinity, mx = -Infinity;
  for (let i = buf.length - 1; i >= 0 && buf[i].t >= t - 2000; i--) { mn = Math.min(mn, buf[i].filt); mx = Math.max(mx, buf[i].filt); }
  amps.push(mx - mn); if (amps.length > 300) amps.shift();
  if (amps.length > 90 && mx - mn > 2.5 * median(amps)) { motionUntil = t + 1000; lastPeakT = prevRR = prev2RR = null; }
  s.mov = t < motionUntil ? 1 : 0;
  detectPeak(t);
  while (buf[0].t < t - 15000) buf.shift();
  if (rec && t - recStart >= recDur) finishRec();
}

function detectPeak(t) {
  const c = buf.length - 1 - K;
  if (c < K) return;
  const p = buf[c];
  for (let i = c - K; i <= c + K; i++) if (buf[i].filt > p.filt) return;
  // período refratário: 60% do RR típico (mínimo 300 ms)
  const refr = rrValid.length >= 4 ? Math.max(300, 0.6 * median(rrValid)) : 300;
  if (lastPeakT !== null && p.t - lastPeakT < refr) return;
  if (p.t < motionUntil) return;
  // limiar adaptativo: 50% da faixa dos últimos 2 s
  let mn = Infinity, mx = -Infinity;
  for (let i = buf.length - 1; i >= 0 && buf[i].t >= t - 2000; i--) { mn = Math.min(mn, buf[i].filt); mx = Math.max(mx, buf[i].filt); }
  if (p.filt < mn + 0.5 * (mx - mn)) return;
  p.peak = 1;
  if (lastPeakT !== null) {
    const rr = p.t - lastPeakT, prev = prevRR, ref = prev2RR;
    prev2RR = prevRR; prevRR = rr;
    let ok = rr >= 300 && rr <= 2000;
    if (ok) {
      const m = rrRecent.length >= 4 ? median(rrRecent) : null;
      rrRecent.push(rr); if (rrRecent.length > 8) rrRecent.shift();
      // sem 4 RR de referência (início da captura) ainda não dá para julgar: não aceita nem conta como descarte
      if (m === null) { lastPeakT = p.t; return; }
      if (ref && prev < 0.85 * ref && rr > 1.1 * ref && Math.abs(prev + rr - 2 * ref) < 0.2 * ref) {
        // possível extrassístole: RR curto seguido de pausa compensatória, os dois somando ~2 RR normais anteriores
        ectopic.push(p.t); ok = false;
        if (beats.length && beats.at(-1).t === lastPeakT) beats.pop();   // tira a batida prematura da curva e do CSV
        const q = buf.find(s => s.t === lastPeakT); if (q) q.rr = '';
      } else ok = rr >= 0.7 * m && rr <= 1.5 * m;   // batimento contado em dobro ou perdido
    }
    rrLog.push(ok); if (rrLog.length > 20) rrLog.shift();
    if (ok) {
      p.rr = Math.round(rr); lastRR = rr; rrValid.push(rr); if (rrValid.length > 8) rrValid.shift();
      beats.push({ t: p.t, hr: 60000 / rr }); while (beats[0].t < t - 60000) beats.shift();
    }
  }
  lastPeakT = p.t;
}

function pacerPhase(t) {
  if (!rate) return null;
  const per = 60000 / rate, x = ((t - pacerT0) % per) / per, inhale = x < INHALE;
  return { inhale, level: inhale ? x / INHALE : 1 - (x - INHALE) / (1 - INHALE) };
}

// variação por respiração: FC máx − mín em cada ciclo do pacer (janelas de 10 s sem pacer),
// média dos últimos 3 ciclos completos com pelo menos 3 batimentos e sem buraco
// (movimento ou batida descartada deixa um intervalo > 1,5 RR e corta os extremos do ciclo)
function rsa(t) {
  if (!rrValid.length) return null;
  const per = rate ? 60000 / rate : 10000, gap = 1.5 * median(rrValid), out = [];
  for (let end = pacerT0 + Math.floor((t - pacerT0) / per) * per; end - per >= pacerT0 && end > t - 60000 && out.length < 3; end -= per) {
    const cyc = beats.filter(b => b.t >= end - per && b.t < end), ts = [end - per, ...cyc.map(b => b.t), end];
    if (cyc.length < 3 || ts.some((x, i) => i && x - ts[i - 1] > gap)) continue;
    const hr = cyc.map(b => b.hr);
    out.push(Math.max(...hr) - Math.min(...hr));
  }
  return out.length ? out.reduce((a, b) => a + b) / out.length : null;
}

const clamp = v => Math.max(0, Math.min(1, v));
function std(a) {
  const m = a.reduce((x, y) => x + y, 0) / a.length;
  return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / a.length);
}
function median(a) {
  const s = [...a].sort((x, y) => x - y), h = s.length >> 1;
  return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
}

function quality(t) {
  const win = buf.filter(s => s.t >= t - 5000);
  if (win.length < 30) return { q: 0, fps: 0, why: 'aguardando sinal' };
  const w2 = win.filter(s => s.t >= t - 2000);
  const fps = (w2.length - 1) * 1000 / (w2[w2.length - 1].t - w2[0].t);
  // amplitude do suavizado vs ruído residual (o que a suavização removeu);
  // a média de 5 atrasa 2 amostras, então compara com a amostra centralizada
  const resid = win.slice(2).map((s, i) => win[i].det - s.sm);
  const snr = std(win.map(s => s.sm)) / (std(resid) || 1e-9);
  const bad = rrLog.filter(ok => !ok).length;
  const sS = clamp((snr - 1) / 3);
  const sR = rrLog.length < 3 ? 0 : clamp(1 - bad / rrLog.length / 0.5);
  const sF = clamp((fps - 15) / 10);
  const why = [];
  if (sS < 0.6) why.push('sinal fraco/ruidoso');
  if (rrLog.length < 3) why.push('poucos batimentos');
  else if (sR < 0.6) why.push(`muitos RR descartados (${bad}/${rrLog.length})`);
  if (sF < 0.6) why.push('fps baixo');
  return { q: Math.round(100 * (0.4 * sS + 0.4 * sR + 0.2 * sF)), fps, why: why.join(', ') };
}

function show() {
  const t = performance.now(), fresh = lastPeakT !== null && t - lastPeakT < 3000;
  $('bpm').textContent = fresh && rrValid.length >= 3 ? Math.round(60000 / median(rrValid)) : '--';
  $('rr').textContent = fresh && lastRR ? Math.round(lastRR) : '--';
  const q = quality(t);
  $('q').textContent = q.q;
  $('fps').textContent = q.fps ? q.fps.toFixed(1) : '--';
  $('reason').textContent = t < motionUntil ? 'Movimento: deixe o dedo parado' : q.why ? 'Motivo: ' + q.why : '';
  const v = rsa(t), ph = pacerPhase(t);
  $('rsa').textContent = v === null ? '--' : Math.round(v);
  ectopic = ectopic.filter(x => x > t - 60000);
  $('ect').textContent = ectopic.length;
  $('pfill').style.width = ph ? 100 * (1 - Math.cos(Math.PI * ph.level)) / 2 + '%' : '0';
  $('plabel').textContent = ph ? (ph.inhale ? 'Inspire' : 'Expire') : 'sem pacer';
  $('status').textContent = statusBase + (rec ? ` · gravando ${Math.ceil((recDur - (t - recStart)) / 1000)} s` : '');
}

function draw() {
  const dpr = window.devicePixelRatio || 1, w = Math.round(chart.clientWidth * dpr), h = Math.round(chart.clientHeight * dpr);
  if (chart.width !== w || chart.height !== h) { chart.width = w; chart.height = h; }
  const col = COLORS[mode], t0 = performance.now() - 10000;
  cx.fillStyle = col.bg; cx.fillRect(0, 0, w, h);
  const win = buf.filter(s => s.t >= t0);
  if (win.length < 2) return;
  const x = s => (s.t - t0) / 10000 * w;
  const scale = get => {
    let mn = Infinity, mx = -Infinity;
    for (const s of win) { mn = Math.min(mn, get(s)); mx = Math.max(mx, get(s)); }
    return s => h - 6 * dpr - (get(s) - mn) / (mx - mn || 1) * (h - 12 * dpr);
  };
  const line = (y, color) => {
    cx.strokeStyle = color; cx.lineWidth = 1.5 * dpr; cx.beginPath();
    win.forEach((s, i) => i ? cx.lineTo(x(s), y(s)) : cx.moveTo(x(s), y(s)));
    cx.stroke();
  };
  line(scale(s => s.raw), col.raw);
  const yf = scale(s => s.filt);
  line(yf, col.filt);
  cx.fillStyle = col.peak;
  for (const s of win) if (s.peak) { cx.beginPath(); cx.arc(x(s), yf(s), 4 * dpr, 0, 7); cx.fill(); }
}

// FC batida a batida dos últimos 30 s; faixas azuis = inspiração do pacer
function drawHR() {
  const dpr = window.devicePixelRatio || 1, w = Math.round(hrc.clientWidth * dpr), h = Math.round(hrc.clientHeight * dpr);
  if (hrc.width !== w || hrc.height !== h) { hrc.width = w; hrc.height = h; }
  const col = COLORS[mode], t0 = performance.now() - 30000, x = tt => (tt - t0) / 30000 * w;
  hx.fillStyle = col.bg; hx.fillRect(0, 0, w, h);
  if (rate) {
    const per = 60000 / rate;
    hx.fillStyle = 'rgba(51,136,255,0.3)';
    for (let c = pacerT0 + Math.floor((t0 - pacerT0) / per) * per; c < t0 + 30000; c += per) hx.fillRect(x(c), 0, INHALE * per / 30000 * w, h);
  }
  const win = beats.filter(b => b.t >= t0);
  if (win.length < 2) return;
  let mn = Math.min(...win.map(b => b.hr)), mx = Math.max(...win.map(b => b.hr));
  if (mx - mn < 10) { const m = (mx + mn) / 2; mn = m - 5; mx = m + 5; }
  const y = hr => h - 12 * dpr - (hr - mn) / (mx - mn) * (h - 24 * dpr);
  hx.strokeStyle = col.filt; hx.lineWidth = 2.5 * dpr; hx.beginPath();
  win.forEach((b, i) => i ? hx.lineTo(x(b.t), y(b.hr)) : hx.moveTo(x(b.t), y(b.hr)));
  hx.stroke();
  hx.fillStyle = col.peak; hx.font = `${12 * dpr}px sans-serif`;
  hx.fillText(Math.round(mx), 4 * dpr, 14 * dpr);
  hx.fillText(Math.round(mn), 4 * dpr, h - 4 * dpr);
}

function finishRec() {
  const rows = rec, t0 = rows[0].t;
  rec = null;
  $('rec').disabled = $('rec2').disabled = $('mode').disabled = false;
  const csv = 'ts_unix_ms,t_rel_ms,bruto,filtrado,pico,rr_ms,garmin_bpm,garmin_rr_ms,pacer,movimento\n' +
    rows.map(s => [s.ts, (s.t - t0).toFixed(1), s.raw.toFixed(3), s.filt.toFixed(4), s.peak, s.rr, s.garmin, s.grr, s.pacer, s.mov].join(',')).join('\n') + '\n';
  const a = $('dl');
  if (a.href) URL.revokeObjectURL(a.href);
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `ppg_${mode}_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
  $('csv').value = csv;
  $('out').hidden = false;
}
</script>
</body>
</html>
